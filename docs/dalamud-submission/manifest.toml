# Draft D17 manifest for AetherFrame. NOT SUBMITTED.
#
# This file is not read by anything in this repository. When AetherFrame is submitted, it is copied
# into a fork of https://github.com/goatcorp/DalamudPluginsD17 as
#
#   testing/live/AetherFrame/manifest.toml      (new plugins must start in testing)
#   testing/live/AetherFrame/images/icon.png    (1:1, 64-512 px)
#   testing/live/AetherFrame/images/image1.png  (optional, up to image5.png, max 730 x 380 PNG)
#
# Before copying: set `commit` to the full SHA of the tagged release commit (it must be public on
# GitHub and contain packages.lock.json from a Release build), and update `changelog`.
# Checklist and PR description: docs/Releasing.md.

[plugin]
repository = "https://github.com/richhiiee/AetherFrame.git"
commit = "REPLACE_WITH_THE_FULL_SHA_OF_THE_RELEASE_TAG_COMMIT"
owners = ["richhiiee"]
project_path = "AetherFrame"
changelog = """
First testing release of AetherFrame: design character Plates in an Adventure Plate-style Basic Editor or a freeform Advanced Editor, keep them in a local My Plates library, and view the Active Plate with /af view.

Everything is local. There is no networking, no account and no data collection.
"""
